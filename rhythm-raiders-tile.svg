<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" style="background:#0a0e2a">
  <!-- Outer green glow border -->
  <rect x="8" y="6" width="144" height="108" rx="4" fill="none" stroke="#33ff33" stroke-width="2.5" opacity=".8"/>
  <!-- Inner border glow -->
  <rect x="8" y="6" width="144" height="108" rx="4" fill="none" stroke="#33ff33" stroke-width="6" opacity=".08"/>

  <!-- Dark panel bg -->
  <rect x="12" y="10" width="136" height="100" rx="2" fill="#111640"/>

  <!-- Title -->
  <text x="80" y="32" font-family="monospace" font-size="9" fill="#33ff33" text-anchor="middle" font-weight="bold" letter-spacing="0.5">Rhythm Memory</text>
  <text x="80" y="44" font-family="monospace" font-size="11" fill="#33ff33" text-anchor="middle" font-weight="bold" letter-spacing="1">HEIST</text>

  <!-- Level text -->
  <text x="80" y="56" font-family="monospace" font-size="6" fill="#33ff33" text-anchor="middle" opacity=".6">Level: 1</text>

  <!-- Four sequence squares -->
  <rect x="34" y="62" width="18" height="18" rx="2" fill="#0a1020" stroke="#33ff33" stroke-width="1.5" opacity=".9"/>
  <rect x="57" y="62" width="18" height="18" rx="2" fill="#0a1020" stroke="#33ff33" stroke-width="1.5" opacity=".9"/>
  <rect x="80" y="62" width="18" height="18" rx="2" fill="#0a1020" stroke="#33ff33" stroke-width="1.5" opacity=".9"/>
  <rect x="103" y="62" width="18" height="18" rx="2" fill="#0a1020" stroke="#33ff33" stroke-width="1.5" opacity=".9"/>

  <!-- Arrow symbols in squares -->
  <text x="43" y="75" font-family="monospace" font-size="9" fill="#33ff33" text-anchor="middle" opacity=".5">↑</text>
  <text x="66" y="75" font-family="monospace" font-size="9" fill="#33ff33" text-anchor="middle" opacity=".5">↓</text>
  <text x="89" y="75" font-family="monospace" font-size="9" fill="#33ff33" text-anchor="middle" opacity=".5">←</text>
  <text x="112" y="75" font-family="monospace" font-size="9" fill="#33ff33" text-anchor="middle" opacity=".5">→</text>

  <!-- Start button -->
  <rect x="52" y="88" width="56" height="14" rx="3" fill="none" stroke="#33ff33" stroke-width="1.5"/>
  <text x="80" y="98" font-family="monospace" font-size="6" fill="#33ff33" text-anchor="middle" font-weight="bold">Start Level</text>

  <!-- Hack the system text -->
  <text x="80" y="112" font-family="monospace" font-size="5" fill="#33ff33" text-anchor="middle" opacity=".4">Hack the system!</text>
</svg>
