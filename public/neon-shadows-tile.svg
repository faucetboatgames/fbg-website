<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" style="background:#0a0010">
  <!-- City skyline background -->
  <!-- Far buildings -->
  <rect x="0" y="45" width="12" height="40" fill="#1a0030"/>
  <rect x="14" y="35" width="10" height="50" fill="#150028"/>
  <rect x="26" y="50" width="8" height="35" fill="#1a0030"/>
  <rect x="36" y="30" width="14" height="55" fill="#12001f"/>
  <rect x="52" y="42" width="10" height="43" fill="#1a0030"/>
  <rect x="64" y="25" width="12" height="60" fill="#150028"/>
  <rect x="78" y="48" width="8" height="37" fill="#1a0030"/>
  <rect x="88" y="33" width="16" height="52" fill="#12001f"/>
  <rect x="106" y="40" width="10" height="45" fill="#1a0030"/>
  <rect x="118" y="28" width="12" height="57" fill="#150028"/>
  <rect x="132" y="45" width="10" height="40" fill="#1a0030"/>
  <rect x="144" y="38" width="16" height="47" fill="#12001f"/>

  <!-- Building windows (tiny lit pixels) -->
  <rect x="16" y="38" width="2" height="2" fill="#ff00ff" opacity=".4"/>
  <rect x="20" y="42" width="2" height="2" fill="#00ffff" opacity=".3"/>
  <rect x="38" y="34" width="2" height="2" fill="#ff00ff" opacity=".5"/>
  <rect x="42" y="40" width="2" height="2" fill="#00ffff" opacity=".3"/>
  <rect x="38" y="48" width="2" height="2" fill="#ff00ff" opacity=".3"/>
  <rect x="66" y="30" width="2" height="2" fill="#00ffff" opacity=".4"/>
  <rect x="70" y="36" width="2" height="2" fill="#ff00ff" opacity=".3"/>
  <rect x="66" y="44" width="2" height="2" fill="#00ffff" opacity=".5"/>
  <rect x="90" y="36" width="2" height="2" fill="#ff00ff" opacity=".4"/>
  <rect x="96" y="42" width="2" height="2" fill="#00ffff" opacity=".3"/>
  <rect x="90" y="50" width="2" height="2" fill="#ff00ff" opacity=".3"/>
  <rect x="120" y="32" width="2" height="2" fill="#00ffff" opacity=".4"/>
  <rect x="124" y="40" width="2" height="2" fill="#ff00ff" opacity=".5"/>
  <rect x="146" y="42" width="2" height="2" fill="#00ffff" opacity=".3"/>
  <rect x="150" y="48" width="2" height="2" fill="#ff00ff" opacity=".4"/>

  <!-- Neon horizon glow -->
  <rect x="0" y="82" width="160" height="3" fill="#ff00ff" opacity=".15"/>
  <rect x="0" y="83" width="160" height="2" fill="#00ffff" opacity=".1"/>

  <!-- Ground / platform -->
  <rect x="0" y="85" width="160" height="35" fill="#0d0018"/>
  <!-- Platform edges -->
  <rect x="0" y="85" width="160" height="2" fill="#ff00ff" opacity=".3"/>
  <!-- Grid lines on ground -->
  <line x1="0" y1="95" x2="160" y2="95" stroke="#ff00ff" stroke-width="0.5" opacity=".08"/>
  <line x1="0" y1="105" x2="160" y2="105" stroke="#ff00ff" stroke-width="0.5" opacity=".06"/>
  <line x1="30" y1="87" x2="30" y2="120" stroke="#ff00ff" stroke-width="0.5" opacity=".05"/>
  <line x1="60" y1="87" x2="60" y2="120" stroke="#ff00ff" stroke-width="0.5" opacity=".05"/>
  <line x1="90" y1="87" x2="90" y2="120" stroke="#ff00ff" stroke-width="0.5" opacity=".05"/>
  <line x1="120" y1="87" x2="120" y2="120" stroke="#ff00ff" stroke-width="0.5" opacity=".05"/>

  <!-- Floating platform -->
  <rect x="95" y="58" width="35" height="4" rx="1" fill="#1a0035"/>
  <rect x="95" y="58" width="35" height="1.5" fill="#ff00ff" opacity=".25"/>

  <!-- Data fragments (collectibles) -->
  <rect x="100" y="52" width="4" height="4" fill="#00ffff" opacity=".7" transform="rotate(45 102 54)"/>
  <rect x="118" y="50" width="3" height="3" fill="#00ffff" opacity=".5" transform="rotate(45 119.5 51.5)"/>

  <!-- Enemy (Neon Shadow) - glitchy figure on platform -->
  <rect x="108" y="48" width="6" height="10" fill="#ff00ff" opacity=".6"/>
  <rect x="107" y="46" width="8" height="4" fill="#ff00ff" opacity=".5"/>
  <!-- Enemy eyes -->
  <rect x="109" y="47" width="2" height="1" fill="#ff3333"/>
  <rect x="113" y="47" width="2" height="1" fill="#ff3333"/>

  <!-- Phosphor Stalker character -->
  <!-- Legs -->
  <rect x="44" y="77" width="3" height="6" fill="#00ddcc"/>
  <rect x="49" y="77" width="3" height="6" fill="#00ddcc"/>
  <!-- Body -->
  <rect x="42" y="66" width="12" height="12" fill="#00eedd"/>
  <!-- Body highlight -->
  <rect x="42" y="66" width="3" height="12" fill="#00ffee" opacity=".4"/>
  <!-- Head -->
  <rect x="44" y="58" width="8" height="8" fill="#00eedd"/>
  <!-- Visor -->
  <rect x="44" y="60" width="8" height="3" fill="#00ffff"/>
  <rect x="44" y="60" width="8" height="3" fill="#fff" opacity=".3"/>
  <!-- Visor glow -->
  <rect x="43" y="59" width="10" height="5" fill="none" stroke="#00ffff" stroke-width="0.5" opacity=".4"/>

  <!-- Gun arm extended right -->
  <rect x="54" y="68" width="10" height="3" fill="#00bbaa"/>
  <!-- Gun -->
  <rect x="62" y="66" width="6" height="7" rx="1" fill="#008888"/>
  <rect x="67" y="68" width="4" height="3" fill="#00ffff" opacity=".6"/>

  <!-- Muzzle flash -->
  <rect x="71" y="67" width="6" height="1" fill="#00ffff" opacity=".8"/>
  <rect x="71" y="69" width="8" height="1" fill="#00ffff" opacity=".5"/>
  <rect x="71" y="71" width="5" height="1" fill="#00ffff" opacity=".6"/>
  <!-- Bullet trail -->
  <line x1="77" y1="69" x2="105" y2="49" stroke="#00ffff" stroke-width="1" opacity=".3"/>

  <!-- Character phosphor glow -->
  <ellipse cx="48" cy="72" rx="14" ry="14" fill="#00ffff" opacity=".04"/>

  <!-- Title -->
  <text x="80" y="100" font-family="monospace" font-size="9" fill="#ff00ff" text-anchor="middle" font-weight="bold" letter-spacing="1.5" opacity=".9">NEON</text>
  <text x="80" y="112" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle" font-weight="bold" letter-spacing="1.5" opacity=".9">SHADOWS</text>
</svg>
